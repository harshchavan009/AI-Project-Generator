services:
  # Meridian FastAPI Backend
  - type: web
    name: meridian-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"

  # Meridian React Frontend
  - type: web
    name: meridian-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: meridian-api
          property: host

databases:
  - name: meridian-db
    databaseName: meridian
    user: meridian
    plan: free
